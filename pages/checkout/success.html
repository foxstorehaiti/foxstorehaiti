<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commande confirmée – Fox Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif; background: #f8fafc; display: flex;
            align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px;
        }
        .success-card {
            background: white; border-radius: 32px; padding: 48px 32px; max-width: 450px;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.06);
        }
        .success-icon {
            width: 80px; height: 80px; background: #00d1ff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;
        }
        .success-icon i { font-size: 48px; color: white; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
        p { color: #4a5568; margin-bottom: 32px; }
        .btn {
            display: inline-block; padding: 14px 28px; background: #00d1ff; color: #0a0c10;
            border-radius: 40px; text-decoration: none; font-weight: 600; margin: 0 8px;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>Commande enregistrée !</h1>
        <p>Votre commande a bien été prise en compte. Vous recevrez une notification dès qu'elle sera validée par l'administrateur.</p>
        <div>
            <a href="/orders.html" class="btn">Voir mes commandes</a>
            <a href="/home.html" class="btn" style="background: transparent; border: 1px solid #ccc;">Accueil</a>
        </div>
    </div>
</body>
</html>
