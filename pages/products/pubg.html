    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDSyFdTHBNULuUiacHM6nmEvPb7YpY24UE",
            authDomain: "foxstoreht.firebaseapp.com",
            projectId: "foxstoreht",
            storageBucket: "foxstoreht.firebasestorage.app",
            messagingSenderId: "72533137445",
            appId: "1:72533137445:web:3ba7634bc34da6115b47cc",
            measurementId: "G-X1Q7Q79BRD"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        window.auth = auth; window.db = db; window.onAuthStateChanged = onAuthStateChanged;
        window.signOut = signOut; window.collection = collection; window.query = query;
        window.where = where; window.getDocs = getDocs; window.addDoc = addDoc;
        window.serverTimestamp = serverTimestamp;
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #f8fafc; --bg-card: #ffffff; --bg-surface: #f1f5f9; --accent: #00d1ff;
            --accent-dark: #0099cc; --text-main: #0a0c10; --text-muted: #4a5568;
            --text-tertiary: #6c757d; --glass-border: rgba(0,0,0,0.06);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04); --shadow-md: 0 12px 28px rgba(0,0,0,0.08);
            --transition: all 0.3s ease;
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg-deep); color: var(--text-main);
            line-height: 1.5; padding-top: 70px;
        }
        .navbar {
            position: fixed; top: 0; width: 100%; z-index: 1000; padding: 12px 24px;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;
        }
        .nav-left { display: flex; align-items: center; gap: 16px; }
        .menu-toggle {
            background: none; border: none; font-size: 24px; color: var(--text-main);
            cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            border-radius: 12px;
        }
        .logo {
            display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-main);
            font-family: 'Clash Display', sans-serif; font-weight: 700; font-size: 20px;
        }
        .logo i { color: var(--accent); }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .user-profile {
            display: flex; align-items: center; gap: 8px; background: var(--bg-surface);
            padding: 6px 12px; border-radius: 40px; border: 1px solid var(--glass-border);
        }
        .user-avatar {
            width: 32px; height: 32px; background: var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;
        }
        .drawer {
            position: fixed; top: 0; left: -300px; width: 300px; height: 100vh; background: var(--bg-card);
            box-shadow: var(--shadow-md); z-index: 2000; transition: left 0.35s; padding: 20px 0;
            border-right: 1px solid var(--glass-border); overflow-y: auto;
        }
        .drawer.open { left: 0; }
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3);
            backdrop-filter: blur(2px); z-index: 1999; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .drawer-overlay.active { opacity: 1; visibility: visible; }
        .drawer-header { padding: 0 20px 20px; border-bottom: 1px solid var(--glass-border); margin-bottom: 16px; }
        .drawer-user { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .drawer-avatar {
            width: 52px; height: 52px; background: var(--accent); border-radius: 16px;
            display: flex; align-items: center; justify-content: center; font-size: 24px; color: white;
        }
        .drawer-section-title {
            padding: 0 20px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.8px; color: var(--text-tertiary);
        }
        .drawer-menu { list-style: none; }
        .drawer-menu li { margin-bottom: 2px; }
        .drawer-menu a {
            display: flex; align-items: center; gap: 14px; padding: 12px 20px; text-decoration: none;
            color: var(--text-main); font-size: 15px; font-weight: 500;
        }
        .drawer-menu a:hover { background: var(--bg-surface); color: var(--accent); }
        .drawer-menu .logout-link { color: #ef4444; }
        .main-content { max-width: 800px; margin: 0 auto; padding: 24px; }
        .product-header { text-align: center; margin-bottom: 32px; }
        .product-header img { height: 80px; margin-bottom: 16px; }
        .product-header h1 { font-family: 'Clash Display', sans-serif; font-size: 36px; }
        .packs-grid { display: grid; gap: 12px; margin-bottom: 32px; }
        .pack-card {
            background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: var(--transition);
        }
        .pack-card.selected { border-color: var(--accent); background: rgba(0,209,255,0.02); }
        .pack-info h3 { font-size: 18px; margin-bottom: 4px; }
        .pack-price { font-weight: 700; color: var(--accent); font-size: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
        input {
            width: 100%; padding: 14px 16px; background: var(--bg-surface); border: 1.5px solid var(--glass-border);
            border-radius: 18px; font-size: 15px;
        }
        .btn {
            width: 100%; padding: 16px; border-radius: 40px; font-size: 16px; font-weight: 700;
            border: none; cursor: pointer; background: var(--accent); color: #0a0c10;
            box-shadow: 0 8px 20px rgba(0,209,255,0.3); transition: var(--transition);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-message {
            background: rgba(239,68,68,0.1); color: #b91c1c; padding: 12px; border-radius: 16px;
            margin-bottom: 16px; display: none;
        }
        .whatsapp-float {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: #25d366;
            color: white; border-radius: 30px; display: flex; align-items: center; justify-content: center;
            font-size: 32px; box-shadow: 0 8px 24px rgba(37,211,102,0.4); z-index: 1000; text-decoration: none;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">

                <a href="/home.html" class="logo"><i class="fas fa-fox"></i><span>FOX STORE</span></a>
            </div>
            <div class="nav-right">
                <div class="user-profile" id="user-profile">
                    <div class="user-avatar" id="user-avatar">F</div>

                </div>
            </div>

    </nav>

    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="drawer" id="drawer">

            <div class="drawer-user">
                <div class="drawer-avatar" id="drawer-avatar">F</div>

                    <h4 id="drawer-name">...</h4>
                    <p id="drawer-email">...</p>

            <div class="drawer-section-title">Principale</div>

            </ul>
        </div>
        <div class="drawer-section">

            <ul class="drawer-menu">
                <li><a href="/gaming.html"><i class="fas fa-gamepad"></i>Gaming</a></li>

    <main class="main-content">
        <div class="product-header">
            <img src="/assets/logos/pubgmobile-logo.png" alt="PUBG Mobile">
            <h1>PUBG Mobile UC</h1>
            <p style="color: var(--text-muted);">Sélectionnez un pack UC et remplissez vos informations</p>

        <form id="order-form">

                <label>Email du compte PUBG <span style="color:#ef4444;">*</span></label>

                <label>ID du personnage (optionnel)</label>
                <input type="text" id="character-id" placeholder="Ex: 512345678">

                <label>Numéro WhatsApp <span style="color:#ef4444;">*</span></label>
                <input type="tel" id="whatsapp" placeholder="+509XXXXXXXX" required>

            <button type="submit" class="btn" id="add-to-cart-btn" disabled>Ajouter au panier</button>
        </form>
    </main>

    <a href="https://wa.me/50937542954" target="_blank" class="whatsapp-float"><i class="fab fa-whatsapp"></i></a>

    <script type="module">
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        
        const auth = getAuth();
        const db = getFirestore();
        let currentUser = null, selectedPack = null;
        const packsContainer = document.getElementById('packs-container');
        const errorDiv = document.getElementById('error-message');
        const addBtn = document.getElementById('add-to-cart-btn');
        
        const menuToggle = document.getElementById('menu-toggle');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('drawer-overlay');
        menuToggle.addEventListener('click', () => { drawer.classList.add('open'); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; });
        overlay.addEventListener('click', () => { drawer.classList.remove('open'); overlay.classList.remove('active'); document.body.style.overflow = ''; });
        document.getElementById('logout-menu-btn').addEventListener('click', async (e) => { e.preventDefault(); await signOut(auth); window.location.href = '/'; });

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 4000);
        }

        async function loadPacks() {
            try {
                const q = query(collection(db, "products"), where("category", "==", "gaming"), where("game", "==", "pubg"), where("active", "==", true));
                const snapshot = await getDocs(q);
                if (snapshot.empty) {
                    packsContainer.innerHTML = '<p style="text-align:center;color:var(--text-tertiary);">Aucun pack disponible.</p>';
                    return;
                }
                let html = '';
                snapshot.forEach(doc => {
                    const pack = doc.data();
                    html += `
                        <div class="pack-card" data-id="${doc.id}" data-name="${pack.name}" data-price="${pack.price}">
                            <div class="pack-info">
                                <h3>${pack.name}</h3>
                                <p style="font-size:14px;color:var(--text-tertiary);">Livraison immédiate</p>
                            </div>
                            <div class="pack-price">${pack.price} HTG</div>
                        </div>
                    `;
                });
                packsContainer.innerHTML = html;
                document.querySelectorAll('.pack-card').forEach(card => {
                    card.addEventListener('click', () => {
                        document.querySelectorAll('.pack-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        selectedPack = { id: card.dataset.id, name: card.dataset.name, price: parseFloat(card.dataset.price) };
                        addBtn.disabled = false;
                    });
                });
            } catch (error) {
                console.error(error);
                showError("Erreur de chargement des packs.");
            }
        }

        document.getElementById('order-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) { showError("Vous devez être connecté."); return; }
            if (!selectedPack) { showError("Veuillez sélectionner un pack."); return; }
            const email = document.getElementById('player-email').value.trim();
            const characterId = document.getElementById('character-id').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();
            if (!email || !whatsapp) { showError("Email et WhatsApp sont obligatoires."); return; }
            
            addBtn.disabled = true;
            addBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Ajout en cours...';
            try {
                await addDoc(collection(db, "carts"), {
                    userId: currentUser.uid,
                    serviceCategory: "gaming",
                    serviceName: "PUBG Mobile",
                    productName: selectedPack.name,
                    price: selectedPack.price,
                    quantity: 1,
                    customerInfo: { email, characterId: characterId || null, whatsapp },
                    addedAt: serverTimestamp()
                });
                window.location.href = '/pages/checkout/cart.html';
            } catch (error) {
                console.error(error);
                showError("Erreur lors de l'ajout au panier: " + error.message);
                addBtn.disabled = false;
                addBtn.innerHTML = 'Ajouter au panier <i class="fas fa-shopping-cart"></i>';
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '/login.html'; return; }
            currentUser = user;
            const displayName = user.displayName || 'Utilisateur';
            document.getElementById('user-name').textContent = displayName.split(' ')[0];
            document.getElementById('user-avatar').textContent = displayName.charAt(0).toUpperCase();
            document.getElementById('drawer-name').textContent = displayName;
            document.getElementById('drawer-email').textContent = user.email;
            document.getElementById('drawer-avatar').textContent = displayName.charAt(0).toUpperCase();
            loadPacks();
        });
    </script>
</body>
