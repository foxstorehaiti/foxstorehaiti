    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #fafcff; --accent: #00d1ff; --text: #0a0c10; --muted: #5b6778;
            --card-bg: rgba(255,255,255,0.7); --border-light: rgba(0,209,255,0.15);
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; position: relative; overflow: hidden;
        }
        /* Arrière-plan animé épuré */
        .bg-gradient {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(0,209,255,0.08) 0%, transparent 40%),
                        radial-gradient(circle at 70% 60%, rgba(0,209,255,0.04) 0%, transparent 40%);
            animation: slowShift 20s infinite alternate ease-in-out; z-index: 0;
        }
        @keyframes slowShift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-3%, -2%); }
        }
        /* Carte principale – style verre dépoli ultra-léger */
        .card {
            position: relative; z-index: 10; max-width: 420px; width: 100%;
            background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 40px; padding: 40px 32px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,209,255,0.05) inset;
            text-align: center;
            animation: cardReveal 0.7s cubic-bezier(0.23, 1, 0.32, 1);
        }
        @keyframes cardReveal {
            0% { opacity: 0; transform: scale(0.96) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        /* Icône Wallet – animation subtile */
        .wallet-icon {
            width: 80px; height: 80px; margin: 0 auto 24px;
            background: rgba(0,209,255,0.06); border-radius: 28px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border-light); color: var(--accent);
            font-size: 38px; transition: all 0.3s ease;
            animation: iconFloat 4s infinite ease-in-out;
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .wallet-icon i { filter: drop-shadow(0 8px 12px rgba(0,209,255,0.2)); }
        /* Titre */
        h1 {
            font-family: 'Clash Display', sans-serif; font-size: 36px; font-weight: 600;
            letter-spacing: -0.5px; margin-bottom: 16px;
            background: linear-gradient(145deg, #0a0c10 0%, #1e293b 80%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .accent-dot {
            display: inline-block; width: 8px; height: 8px; background: var(--accent);
            border-radius: 50%; margin: 0 8px 2px; box-shadow: 0 0 12px var(--accent);
        }
        /* Badge élégant */
        .status-badge {
            display: inline-block; padding: 6px 20px; border-radius: 60px;
            background: rgba(0,209,255,0.08); border: 1px solid var(--border-light);
            font-size: 13px; font-weight: 500; letter-spacing: 0.8px; text-transform: uppercase;
            color: var(--accent); margin-bottom: 24px; backdrop-filter: blur(4px);
        }
        /* Message – concis et impactant */
        .message {
            font-size: 16px; color: var(--muted); margin-bottom: 32px; line-height: 1.6;
        }
        .message strong { color: var(--text); font-weight: 600; }
        /* Boutons */
        .btn-group { display: flex; gap: 12px; justify-content: center; }
        .btn {
            padding: 14px 28px; border-radius: 60px; font-weight: 600; font-size: 15px;
            text-decoration: none; transition: all 0.25s; display: inline-flex;
            align-items: center; gap: 10px; border: 1px solid transparent;
        }
        .btn-primary {
            background: var(--accent); color: #0a0c10;
            box-shadow: 0 10px 20px -5px rgba(0,209,255,0.3);
        }
        .btn-primary:hover { background: #0099cc; transform: translateY(-2px); box-shadow: 0 15px 25px -5px rgba(0,209,255,0.4); }
        .btn-outline {
            background: transparent; border-color: rgba(0,0,0,0.08); color: var(--text);
        }
        .btn-outline:hover { background: rgba(0,0,0,0.02); border-color: var(--accent); }
        /* WhatsApp Float – discret mais présent */
        .wa-float {
            position: fixed; bottom: 24px; right: 24px; width: 52px; height: 52px;
            background: #25d366; color: white; border-radius: 26px;
            display: flex; align-items: center; justify-content: center; font-size: 28px;
            box-shadow: 0 12px 28px rgba(37,211,102,0.25); z-index: 100;
            transition: all 0.2s; border: 1px solid rgba(255,255,255,0.2);
        }
        .wa-float:hover { transform: scale(1.05); background: #20b859; }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="card">
        <div class="wallet-icon">
            <i class="fas fa-wallet"></i>
        </div>
        <h1>Wallet <span class="accent-dot"></span> Pro</h1>
        <div class="status-badge">
            <i class="fas fa-clock" style="margin-right: 6px;"></i> Disponible prochainement
        </div>
        <p class="message">
            <strong>Portefeuille numérique</strong> en cours d'intégration.<br>
            Une expérience de paiement repensée,<br>simple et sécurisée.
        </p>
        <div class="btn-group">
            <a href="/home.html" class="btn btn-primary">
                <i class="fas fa-arrow-left"></i> Accueil
            </a>
            <a href="/user/notifications.html" class="btn btn-outline">
                <i class="fas fa-bell"></i> Alertes
            </a>
        </div>
    </div>

    <a href="https://wa.me/50937542954" target="_blank" class="wa-float">
        <i class="fab fa-whatsapp"></i>
    </a>
</body>
</html>
