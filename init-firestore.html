<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initialisation Firestore - Fox Store</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.06);
        }
        h2 { color: #0a0c10; margin-bottom: 16px; }
        p { color: #4a5568; margin-bottom: 24px; }
        button {
            background: #00d1ff;
            border: none;
            padding: 16px 32px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            color: #0a0c10;
            transition: 0.3s;
        }
        button:hover { background: #0099cc; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 16px;
            font-size: 14px;
        }
        .success { background: rgba(16,185,129,0.1); color: #065f46; }
        .error { background: rgba(239,68,68,0.1); color: #b91c1c; }
        .info { background: rgba(0,209,255,0.1); color: #0099cc; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Initialisation Firestore</h2>
        <p>Cette page va créer automatiquement toutes les collections et produits nécessaires.</p>
        <p style="font-size:14px;">Vous devez être connecté en tant qu'administrateur.</p>
        
        <button id="init-btn">Lancer l'initialisation</button>
        
        <div id="status" class="hidden"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDSyFdTHBNULuUiacHM6nmEvPb7YpY24UE",
            authDomain: "foxstoreht.firebaseapp.com",
            projectId: "foxstoreht",
            storageBucket: "foxstoreht.firebasestorage.app",
            messagingSenderId: "72533137445",
            appId: "1:72533137445:web:3ba7634bc34da6115b47cc",
            measurementId: "G-X1Q7Q79BRD"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const statusDiv = document.getElementById('status');
        const initBtn = document.getElementById('init-btn');
        
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = type;
            statusDiv.classList.remove('hidden');
        }
        
        async function initializeFirestore() {
            const user = auth.currentUser;
            if (!user) {
                showStatus("Vous devez être connecté. Redirection...", "error");
                setTimeout(() => window.location.href = '/login.html', 2000);
                return false;
            }
            
            if (user.email !== "foxstorehaiti@gmail.com") {
                showStatus("Accès refusé. Seul l'administrateur peut initialiser.", "error");
                return false;
            }
            
            return true;
        }
        
        async function runInit() {
            initBtn.disabled = true;
            initBtn.textContent = "Initialisation en cours...";
            
            const canInit = await initializeFirestore();
            if (!canInit) {
                initBtn.disabled = false;
                initBtn.textContent = "Lancer l'initialisation";
                return;
            }
            
            try {
                showStatus("Vérification des données existantes...", "info");
                const productsSnap = await getDocs(collection(db, "products"));
                
                if (!productsSnap.empty) {
                    showStatus("La base est déjà initialisée. Redirection...", "success");
                    setTimeout(() => window.location.href = '/home.html', 2000);
                    return;
                }
                
                showStatus("Création des collections et produits...", "info");
                const batch = writeBatch(db);
                
                // Paramètres
                const settingsRef = doc(db, "settings", "general");
                batch.set(settingsRef, {
                    siteName: "Fox Store",
                    currency: "HTG",
                    usdRate: 150,
                    wiseRate: 150,
                    paypalRate: 150,
                    usdtRate: 150,
                    tronxRate: 0.30,
                    maintenanceMode: false,
                    updatedAt: new Date()
                });
                
                // Liste complète des produits
                const products = [
                    // Gaming - Free Fire
                    { id: "freefire-110", category: "gaming", game: "freefire", name: "110 + 10 Diamants", price: 157, currency: "HTG", active: true },
                    { id: "freefire-310", category: "gaming", game: "freefire", name: "310 + 31 Diamants", price: 471, currency: "HTG", active: true },
                    { id: "freefire-520", category: "gaming", game: "freefire", name: "520 + 52 Diamants", price: 775, currency: "HTG", active: true },
                    { id: "freefire-1060", category: "gaming", game: "freefire", name: "1060 + 106 Diamants", price: 1550, currency: "HTG", active: true },
                    { id: "freefire-2180", category: "gaming", game: "freefire", name: "2180 + 218 Diamants", price: 3100, currency: "HTG", active: true },
                    { id: "freefire-5600", category: "gaming", game: "freefire", name: "5600 + 560 Diamants", price: 7750, currency: "HTG", active: true },
                    // Gaming - PUBG Mobile
                    { id: "pubg-60", category: "gaming", game: "pubg", name: "60 UC", price: 180, currency: "HTG", active: true },
                    { id: "pubg-300", category: "gaming", game: "pubg", name: "300 + 25 UC", price: 891, currency: "HTG", active: true },
                    { id: "pubg-600", category: "gaming", game: "pubg", name: "600 + 60 UC", price: 1780, currency: "HTG", active: true },
                    // Gaming - Roblox
                    { id: "roblox-500", category: "gaming", game: "roblox", name: "500 Robux", price: 750, currency: "HTG", active: true },
                    { id: "roblox-1000", category: "gaming", game: "roblox", name: "1000 Robux", price: 1460, currency: "HTG", active: true },
                    // Streaming - Netflix
                    { id: "netflix-1m", category: "streaming", service: "netflix", name: "Netflix Premium 1 mois", price: 400, currency: "HTG", active: true },
                    { id: "netflix-2m", category: "streaming", service: "netflix", name: "Netflix Premium 2 mois", price: 850, currency: "HTG", active: true },
                    { id: "netflix-3m", category: "streaming", service: "netflix", name: "Netflix Premium 3 mois", price: 1300, currency: "HTG", active: true },
                    // Streaming - Disney+
                    { id: "disney-1m", category: "streaming", service: "disneyplus", name: "Disney+ Premium 1 mois", price: 625, currency: "HTG", active: true },
                    { id: "disney-2m", category: "streaming", service: "disneyplus", name: "Disney+ Premium 2 mois", price: 1200, currency: "HTG", active: true },
                    // Finance
                    { id: "wise-recharge", category: "finance", service: "wise", name: "Recharge Wise", price: 150, currency: "HTG", unit: "USD", active: true },
                    { id: "paypal-recharge", category: "finance", service: "paypal", name: "Recharge PayPal", price: 150, currency: "HTG", unit: "USD", active: true },
                    { id: "usdt-recharge", category: "finance", service: "usdt", name: "Recharge USDT TRC20", price: 150, currency: "HTG", unit: "USD", active: true }
                ];
                
                products.forEach(p => {
                    const prodRef = doc(db, "products", p.id);
                    batch.set(prodRef, p);
                });
                
                await batch.commit();
                showStatus("Initialisation réussie ! Redirection vers l'accueil...", "success");
                setTimeout(() => window.location.href = '/home.html', 2000);
                
            } catch (error) {
                console.error(error);
                showStatus("Erreur : " + error.message, "error");
                initBtn.disabled = false;
                initBtn.textContent = "Réessayer";
            }
        }
        
        initBtn.addEventListener('click', runInit);
        
        // Vérifier l'auth au chargement
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                showStatus("Veuillez vous connecter d'abord.", "error");
                initBtn.disabled = true;
                setTimeout(() => window.location.href = '/login.html', 2000);
            } else if (user.email !== "foxstorehaiti@gmail.com") {
                showStatus("Accès réservé à l'administrateur.", "error");
                initBtn.disabled = true;
            }
        });
    </script>
</body>
</html>
