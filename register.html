<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Inscription – Fox Store</title>
    
    <!-- Firebase 9 SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            updateProfile 
        } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDSyFdTHBNULuUiacHM6nmEvPb7YpY24UE",
            authDomain: "foxstoreht.firebaseapp.com",
            projectId: "foxstoreht",
            storageBucket: "foxstoreht.firebasestorage.app",
            messagingSenderId: "72533137445",
            appId: "1:72533137445:web:3ba7634bc34da6115b47cc",
            measurementId: "G-X1Q7Q79BRD"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        window.auth = auth;
        window.db = db;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.updateProfile = updateProfile;
        window.setDoc = setDoc;
        window.doc = doc;
        window.serverTimestamp = serverTimestamp;
    </script>
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Polices premium -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #f8fafc;
            --bg-card: #ffffff;
            --bg-surface: #f1f5f9;
            --accent: #00d1ff;
            --accent-dark: #0099cc;
            --text-main: #0a0c10;
            --text-muted: #4a5568;
            --text-tertiary: #6c757d;
            --glass-border: rgba(0, 0, 0, 0.06);
            --shadow-md: 0 16px 32px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 24px 48px rgba(0, 0, 0, 0.08);
            --transition: all 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Fond décoratif */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 40%, rgba(0, 209, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(0, 209, 255, 0.04) 0%, transparent 50%);
            pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            border-radius: 36px;
            padding: 44px 36px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--glass-border);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(2px);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 36px;
            text-decoration: none;
            color: var(--text-main);
            font-family: 'Clash Display', sans-serif;
            font-weight: 700;
            font-size: 26px;
            letter-spacing: -0.5px;
        }

        .logo i {
            color: var(--accent);
            font-size: 30px;
        }

        h2 {
            font-family: 'Clash Display', sans-serif;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 36px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 18px;
            transition: var(--transition);
        }

        input {
            width: 100%;
            padding: 16px 18px 16px 52px;
            background: var(--bg-surface);
            border: 1.5px solid var(--glass-border);
            border-radius: 20px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 209, 255, 0.1);
        }

        .input-wrapper:focus-within i {
            color: var(--accent);
        }

        .terms {
            margin: 24px 0 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }

        .terms a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--accent);
            color: #0a0c10;
            box-shadow: 0 10px 24px rgba(0, 209, 255, 0.3);
            transition: var(--transition);
        }

        .btn:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 16px 32px rgba(0, 209, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-link {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-link a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
            margin-left: 6px;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.08);
            color: #b91c1c;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 13px;
            margin-bottom: 24px;
            border-left: 4px solid #b91c1c;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .error-message.show {
            display: flex;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.08);
            color: #065f46;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 13px;
            margin-bottom: 24px;
            border-left: 4px solid #10b981;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .success-message.show {
            display: flex;
        }

        .footer-note {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        /* Password strength indicator */
        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: var(--bg-surface);
            border-radius: 4px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background 0.3s;
        }

        .strength-weak { width: 25%; background: #ef4444; }
        .strength-fair { width: 50%; background: #f59e0b; }
        .strength-good { width: 75%; background: #3b82f6; }
        .strength-strong { width: 100%; background: #10b981; }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-container {
                padding: 36px 24px;
                border-radius: 28px;
            }
            .logo {
                font-size: 22px;
            }
            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <a href="/" class="logo">
            <i class="fas fa-fox"></i>
            <span>FOX STORE</span>
        </a>
        <h2>Inscription</h2>
        <p class="subtitle">Rejoignez l'élite du service digital</p>

        <!-- Message d'erreur -->
        <div id="error-message" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span id="error-text"></span>
        </div>

        <!-- Message de succès -->
        <div id="success-message" class="success-message">
            <i class="fas fa-check-circle"></i>
            <span id="success-text"></span>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label for="fullname">Nom complet</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="fullname" name="fullname" placeholder="Jean Dupont" autocomplete="name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Adresse email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="vous@exemple.com" autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Minimum 6 caractères" autocomplete="new-password" minlength="6" required>
                </div>
                <div class="password-strength">
                    <div id="strength-bar" class="strength-bar"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm">Confirmer le mot de passe</label>
                <div class="input-wrapper">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="confirm" name="confirm" placeholder="••••••••" autocomplete="new-password" required>
                </div>
            </div>

            <div class="terms">
                En cliquant sur "S'inscrire", vous acceptez nos 
                <a href="#">Conditions d'utilisation</a> et notre 
                <a href="#">Politique de confidentialité</a>.
            </div>

            <button type="submit" class="btn" id="register-btn">
                <span>S'inscrire</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="login-link">
            Déjà un compte ?
            <a href="login.html">Se connecter</a>
        </div>

        <p class="footer-note">Inscription gratuite • Accès immédiat</p>
    </div>

    <script type="module">
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        
        const auth = getAuth();
        const db = getFirestore();
        
        const registerForm = document.getElementById('register-form');
        const fullnameInput = document.getElementById('fullname');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm');
        const errorDiv = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const successDiv = document.getElementById('success-message');
        const successText = document.getElementById('success-text');
        const registerBtn = document.getElementById('register-btn');
        const strengthBar = document.getElementById('strength-bar');

        // Fonctions utilitaires
        function showError(message) {
            errorText.textContent = message;
            errorDiv.classList.add('show');
            successDiv.classList.remove('show');
            setTimeout(() => errorDiv.classList.remove('show'), 6000);
        }

        function showSuccess(message) {
            successText.textContent = message;
            successDiv.classList.add('show');
            errorDiv.classList.remove('show');
            setTimeout(() => successDiv.classList.remove('show'), 6000);
        }

        function setLoading(isLoading) {
            registerBtn.disabled = isLoading;
            if (isLoading) {
                registerBtn.innerHTML = `<span>Inscription en cours...</span><i class="fas fa-spinner fa-pulse"></i>`;
            } else {
                registerBtn.innerHTML = `<span>S'inscrire</span><i class="fas fa-arrow-right"></i>`;
            }
        }

        // Évaluation force du mot de passe
        function evaluatePasswordStrength(password) {
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            strengthBar.className = 'strength-bar';
            if (strength <= 1) strengthBar.classList.add('strength-weak');
            else if (strength === 2) strengthBar.classList.add('strength-fair');
            else if (strength === 3) strengthBar.classList.add('strength-good');
            else if (strength >= 4) strengthBar.classList.add('strength-strong');
        }

        passwordInput.addEventListener('input', (e) => {
            evaluatePasswordStrength(e.target.value);
        });

        // Soumission du formulaire
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullname = fullnameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            // Validation basique
            if (!fullname || !email || !password || !confirm) {
                showError("Tous les champs sont obligatoires.");
                return;
            }

            if (fullname.length < 2) {
                showError("Le nom complet doit contenir au moins 2 caractères.");
                return;
            }

            if (password !== confirm) {
                showError("Les mots de passe ne correspondent pas.");
                return;
            }

            if (password.length < 6) {
                showError("Le mot de passe doit contenir au moins 6 caractères.");
                return;
            }

            setLoading(true);
            
            try {
                // 1. Création du compte Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // 2. Mise à jour du profil (displayName)
                await updateProfile(user, { displayName: fullname });
                
                // 3. Création du document utilisateur dans Firestore
                const userDocRef = doc(db, "users", user.uid);
                await setDoc(userDocRef, {
                    uid: user.uid,
                    email: email,
                    displayName: fullname,
                    photoURL: null,
                    role: "user",
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp(),
                    lastLogin: null,
                    isActive: true
                });
                
                // 4. Succès : message et redirection vers login
                showSuccess("Compte créé avec succès. Redirection vers la connexion...");
                
                // Déconnexion immédiate pour forcer une connexion propre
                await auth.signOut();
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                console.error("Erreur d'inscription:", error.code);
                let message = "Une erreur est survenue lors de l'inscription.";
                
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        message = "Cette adresse email est déjà utilisée.";
                        break;
                    case 'auth/invalid-email':
                        message = "Adresse email invalide.";
                        break;
                    case 'auth/weak-password':
                        message = "Mot de passe trop faible. Utilisez au moins 6 caractères.";
                        break;
                    case 'auth/network-request-failed':
                        message = "Problème de connexion réseau.";
                        break;
                    case 'auth/too-many-requests':
                        message = "Trop de tentatives. Réessayez plus tard.";
                        break;
                    default:
                        message = "Erreur: " + error.message;
                }
                showError(message);
            } finally {
                setLoading(false);
            }
        });

        // Focus automatique sur le nom
        fullnameInput.focus();
    </script>
</body>
</html>
